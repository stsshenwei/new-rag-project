templates:
  - id: "session_title"
    name: "Session Title"
    description: "Generate a short conversation title."
    modes: ["quick", "reasoning"]
    default_language: "zh-CN"
    required: true
    placeholders: ["question", "answer", "language"]
    content: |
      Generate a concise conversation title in {{language}}.
      Return plain text only, no quotes, no markdown, no punctuation-only output.
      Limit to 24 Chinese characters or 8 English words.

      Question: {{question}}
      Answer: {{answer}}
