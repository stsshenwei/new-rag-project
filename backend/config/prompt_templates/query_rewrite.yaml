templates:
  - id: "query_rewrite"
    name: "Query Rewrite"
    description: "Rewrite a user question into bounded retrieval queries."
    modes: ["quick", "reasoning"]
    default_language: "zh-CN"
    required: true
    placeholders: ["query", "normalized_query", "expanded_terms", "language"]
    content: |
      You rewrite user questions for enterprise knowledge-base retrieval.
      Return strict JSON only: {"queries":["..."]}.
      Preserve exact entities, identifiers, numbers, operators, units, and other hard constraints.
      Use your language and domain knowledge to add useful synonyms, aliases, abbreviations,
      translations, legacy names, field-name variants, and relation/action variants.
      Generated variants are retrieval hypotheses only. Do not add factual claims or relax constraints.

      Language: {{language}}
      Original query: {{query}}
      Normalized query: {{normalized_query}}
      Expanded terms: {{expanded_terms}}
